<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #FFFFFF;
            --text: #1A1A1A;
            --text-secondary: #666666;
            --accent: #4A5568;
            --border: #E5E5E5;
            --dot: #D4D4D4;
            --dot-filled: #4A5568;
        }

        [data-theme="dark"] {
            --bg: #1A1A1A;
            --text: #E5E5E5;
            --text-secondary: #999999;
            --accent: #8E9AAF;
            --border: #333333;
            --dot: #404040;
            --dot-filled: #8E9AAF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            font-weight: 400;
            transition: background 200ms, color 200ms;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 20px;
            font-weight: 500;
            color: var(--text);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
            opacity: 0.6;
            transition: opacity 200ms;
        }

        .theme-toggle:hover {
            opacity: 1;
        }

        .stats {
            margin-bottom: 60px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--text);
        }

        .year-grid {
            margin-bottom: 80px;
        }

        .dots {
            display: grid;
            grid-template-columns: repeat(auto-fill, 4px);
            gap: 3px;
            margin-bottom: 40px;
        }

        .dot {
            width: 4px;
            height: 4px;
            background: var(--dot);
            border-radius: 50%;
        }

        .dot.filled {
            background: var(--dot-filled);
        }

        .dot.today {
            background: var(--accent);
            width: 5px;
            height: 5px;
        }

        .entry-section {
            margin-bottom: 80px;
        }

        .entry-input {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-size: 14px;
            padding: 8px 0;
            font-family: inherit;
            transition: border-color 200ms;
            margin-bottom: 40px;
        }

        .entry-input:focus {
            outline: none;
            border-bottom-color: var(--accent);
        }

        .entry-input::placeholder {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .entries {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .entry {
            display: flex;
            gap: 16px;
        }

        .entry-date {
            color: var(--text-secondary);
            font-size: 14px;
            min-width: 60px;
            flex-shrink: 0;
        }

        .entry-text {
            color: var(--text);
            font-size: 14px;
        }

        @media (max-width: 480px) {
            body {
                padding: 40px 16px;
            }

            header {
                margin-bottom: 60px;
            }

            .stats {
                margin-bottom: 40px;
            }

            .year-grid {
                margin-bottom: 60px;
            }

            .entry-section {
                margin-bottom: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 id="yearTitle">2025</h1>
            <button class="theme-toggle" id="themeToggle">Dark</button>
        </header>

        <div class="stats">
            <div class="stat-line">
                <span class="stat-label">Days elapsed</span>
                <span class="stat-value" id="daysElapsed">0</span>
            </div>
            <div class="stat-line">
                <span class="stat-label">Days remaining</span>
                <span class="stat-value" id="daysRemaining">0</span>
            </div>
        </div>

        <div class="year-grid">
            <div class="dots" id="dotsContainer"></div>
        </div>

        <div class="entry-section">
            <input
                type="text"
                class="entry-input"
                id="entryInput"
                placeholder="Today's entry"
                maxlength="200"
            >
            <div class="entries" id="entriesList"></div>
        </div>
    </div>

    <script>
        // Theme management
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const currentTheme = localStorage.getItem('theme') || 'light';

        html.setAttribute('data-theme', currentTheme);
        themeToggle.textContent = currentTheme === 'light' ? 'Dark' : 'Light';

        themeToggle.addEventListener('click', () => {
            const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'light' ? 'Dark' : 'Light';
        });

        // Year calculations
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        function formatDate(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[date.getMonth()]} ${date.getDate()}`;
        }

        function renderYear() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const totalDays = isLeapYear(currentYear) ? 366 : 365;
            const currentDay = getDayOfYear(now);
            const daysRemaining = totalDays - currentDay;

            // Update title and stats
            document.getElementById('yearTitle').textContent = currentYear;
            document.getElementById('daysElapsed').textContent = currentDay;
            document.getElementById('daysRemaining').textContent = daysRemaining;

            // Render dots
            const dotsContainer = document.getElementById('dotsContainer');
            dotsContainer.innerHTML = '';

            for (let i = 1; i <= totalDays; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';

                if (i < currentDay) {
                    dot.classList.add('filled');
                } else if (i === currentDay) {
                    dot.classList.add('today');
                }

                dotsContainer.appendChild(dot);
            }
        }

        // Entry management
        function loadEntries() {
            const entries = JSON.parse(localStorage.getItem('entries') || '[]');
            return entries.sort((a, b) => new Date(b.date) - new Date(a.date));
        }

        function saveEntry(text) {
            const entries = loadEntries();
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Check if entry for today already exists
            const existingIndex = entries.findIndex(e => {
                const entryDate = new Date(e.date);
                entryDate.setHours(0, 0, 0, 0);
                return entryDate.getTime() === today.getTime();
            });

            if (existingIndex !== -1) {
                entries[existingIndex].text = text;
            } else {
                entries.push({
                    date: today.toISOString(),
                    text: text
                });
            }

            localStorage.setItem('entries', JSON.stringify(entries));
            renderEntries();
        }

        function renderEntries() {
            const entries = loadEntries();
            const entriesList = document.getElementById('entriesList');

            if (entries.length === 0) {
                entriesList.innerHTML = '';
                return;
            }

            entriesList.innerHTML = entries.map(entry => {
                const date = new Date(entry.date);
                return `
                    <div class="entry">
                        <div class="entry-date">${formatDate(date)}</div>
                        <div class="entry-text">${entry.text}</div>
                    </div>
                `;
            }).join('');
        }

        // Entry input handler
        const entryInput = document.getElementById('entryInput');

        // Load today's entry if it exists
        const entries = loadEntries();
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const todayEntry = entries.find(e => {
            const entryDate = new Date(e.date);
            entryDate.setHours(0, 0, 0, 0);
            return entryDate.getTime() === today.getTime();
        });

        if (todayEntry) {
            entryInput.value = todayEntry.text;
        }

        entryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && entryInput.value.trim()) {
                saveEntry(entryInput.value.trim());
                entryInput.blur();
            }
        });

        entryInput.addEventListener('blur', () => {
            if (entryInput.value.trim()) {
                saveEntry(entryInput.value.trim());
            }
        });

        // Initialize
        renderYear();
        renderEntries();

        // Update at midnight
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                renderYear();
                entryInput.value = '';
            }
        }, 60000);
    </script>
</body>
</html>
