<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dog Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #FFF5F7;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Pixel Dog Container */
        .dog-container {
            position: absolute;
            top: 57%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
        }

        /* Pixel Art Dog */
        .pixel-dog {
            width: 160px;
            height: 160px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            position: relative;
        }

        /* Dog sprite using CSS grid for pixel art */
        .dog-sprite {
            display: grid;
            grid-template-columns: repeat(32, 5px);
            grid-template-rows: repeat(32, 5px);
            gap: 0;
        }

        .pixel {
            width: 5px;
            height: 5px;
        }

        /* Colors */
        .brown { background: #8B5A3C; }
        .dark-brown { background: #5C3A29; }
        .white { background: #FFF; }
        .black { background: #000; }
        .pink { background: #FFB6C1; }
        .nose { background: #3D2817; }
        .empty { background: transparent; }

        /* Tail wagging animation */
        @keyframes wag-tail {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(15deg); }
        }

        .dog-container:hover .tail {
            animation: wag-tail 0.3s ease-in-out infinite;
        }

        /* Idle animation - subtle movement */
        @keyframes idle-bounce {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-3px); }
        }

        .dog-container.idle {
            animation: idle-bounce 1.5s ease-in-out;
        }

        /* Timer Panel */
        .timer-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90vw;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-panel.collapsed {
            transform: translateX(-50%) translateY(calc(100% - 60px));
        }

        .panel-header {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .toggle-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FFE4E9;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
        }

        .toggle-arrow:hover {
            background: #FFD1DC;
        }

        .toggle-arrow::after {
            content: '▼';
            font-size: 14px;
            color: #8B5A3C;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-panel.collapsed .toggle-arrow::after {
            transform: rotate(180deg);
        }

        .panel-content {
            padding: 0 30px 30px;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #8B5A3C;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .timer-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .time-input {
            width: 80px;
            padding: 12px;
            border: 2px solid #FFE4E9;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: white;
            transition: border-color 0.3s;
        }

        .time-input:focus {
            outline: none;
            border-color: #FFB6C1;
        }

        .input-label {
            font-size: 12px;
            color: #8B5A3C;
            text-align: center;
            margin-top: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .btn-start {
            background: #8B5A3C;
            color: white;
        }

        .btn-start:hover {
            background: #6F4730;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 90, 60, 0.3);
        }

        .btn-stop {
            background: #FFB6C1;
            color: #5C3A29;
        }

        .btn-stop:hover {
            background: #FFA0B0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loop-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #8B5A3C;
            font-size: 14px;
        }

        /* Custom Toggle Switch */
        .switch {
            position: relative;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #FFE4E9;
            transition: 0.4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #8B5A3C;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .timer-panel {
                width: 100vw;
            }

            .timer-display {
                font-size: 36px;
            }

            .dog-sprite {
                grid-template-columns: repeat(32, 4px);
                grid-template-rows: repeat(32, 4px);
            }

            .pixel {
                width: 4px;
                height: 4px;
            }
        }
    </style>
</head>
<body>
    <!-- Pixel Dog -->
    <div class="dog-container" id="dogContainer">
        <svg class="pixel-dog" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <!-- Body -->
            <rect x="20" y="28" width="24" height="20" fill="#8B5A3C"/>
            <rect x="18" y="30" width="2" height="16" fill="#8B5A3C"/>
            <rect x="44" y="30" width="2" height="16" fill="#8B5A3C"/>

            <!-- Legs -->
            <rect x="22" y="48" width="6" height="10" fill="#8B5A3C"/>
            <rect x="36" y="48" width="6" height="10" fill="#8B5A3C"/>
            <rect x="22" y="58" width="6" height="2" fill="#5C3A29"/>
            <rect x="36" y="58" width="6" height="2" fill="#5C3A29"/>

            <!-- Head -->
            <rect x="24" y="14" width="16" height="16" fill="#8B5A3C"/>
            <rect x="22" y="16" width="2" height="12" fill="#8B5A3C"/>
            <rect x="40" y="16" width="2" height="12" fill="#8B5A3C"/>

            <!-- Ears -->
            <rect x="24" y="10" width="6" height="6" fill="#8B5A3C"/>
            <rect x="34" y="10" width="6" height="6" fill="#8B5A3C"/>
            <rect x="26" y="12" width="2" height="2" fill="#5C3A29"/>
            <rect x="36" y="12" width="2" height="2" fill="#5C3A29"/>

            <!-- Face -->
            <rect x="28" y="20" width="3" height="3" fill="#000"/>
            <rect x="33" y="20" width="3" height="3" fill="#000"/>
            <rect x="30" y="24" width="4" height="4" fill="#3D2817"/>

            <!-- Chest patch -->
            <rect x="28" y="32" width="8" height="10" fill="#FFF"/>

            <!-- Tail -->
            <g class="tail" transform-origin="44 30">
                <rect x="44" y="30" width="4" height="2" fill="#8B5A3C"/>
                <rect x="48" y="28" width="4" height="2" fill="#8B5A3C"/>
                <rect x="52" y="26" width="4" height="2" fill="#8B5A3C"/>
            </g>

            <!-- Collar -->
            <rect x="24" y="28" width="16" height="3" fill="#FFB6C1"/>
            <rect x="31" y="28" width="2" height="3" fill="#FFD700"/>
        </svg>
    </div>

    <!-- Timer Panel -->
    <div class="timer-panel collapsed" id="timerPanel">
        <div class="panel-header" id="panelHeader">
            <div class="toggle-arrow"></div>
        </div>
        <div class="panel-content">
            <div class="timer-display" id="timerDisplay">00:00</div>

            <div class="timer-inputs">
                <div class="input-group">
                    <input type="number" class="time-input" id="minutesInput" min="0" max="99" value="5" placeholder="00">
                    <div class="input-label">minutes</div>
                </div>
                <div class="input-group">
                    <input type="number" class="time-input" id="secondsInput" min="0" max="59" value="0" placeholder="00">
                    <div class="input-label">seconds</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-start" id="startBtn">Start</button>
                <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
            </div>

            <div class="loop-toggle">
                <span>Loop Timer</span>
                <label class="switch">
                    <input type="checkbox" id="loopToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <script>
        // Timer Panel Toggle
        const timerPanel = document.getElementById('timerPanel');
        const panelHeader = document.getElementById('panelHeader');

        panelHeader.addEventListener('click', () => {
            timerPanel.classList.toggle('collapsed');
        });

        // Timer Logic
        let timerInterval = null;
        let remainingTime = 0;
        let isRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const loopToggle = document.getElementById('loopToggle');

        // Audio Context for bell sound
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBellSound() {
            initAudio();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // Boxing bell sound (two tones)
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);

            // Second ding
            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();

                osc2.connect(gain2);
                gain2.connect(audioContext.destination);

                osc2.frequency.setValueAtTime(800, audioContext.currentTime);
                osc2.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);

                gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.5);
            }, 200);
        }

        function updateDisplay() {
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            initAudio(); // Initialize audio on user interaction

            if (!isRunning) {
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                remainingTime = minutes * 60 + seconds;

                if (remainingTime === 0) return;

                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                minutesInput.disabled = true;
                secondsInput.disabled = true;

                timerInterval = setInterval(() => {
                    if (remainingTime > 0) {
                        remainingTime--;
                        updateDisplay();
                    } else {
                        playBellSound();

                        if (loopToggle.checked) {
                            const minutes = parseInt(minutesInput.value) || 0;
                            const seconds = parseInt(secondsInput.value) || 0;
                            remainingTime = minutes * 60 + seconds;
                        } else {
                            stopTimer();
                        }
                    }
                }, 1000);

                updateDisplay();
            }
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            minutesInput.disabled = false;
            secondsInput.disabled = false;

            const minutes = parseInt(minutesInput.value) || 0;
            const seconds = parseInt(secondsInput.value) || 0;
            remainingTime = minutes * 60 + seconds;
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);

        // Update display when inputs change
        minutesInput.addEventListener('input', () => {
            if (!isRunning) {
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                remainingTime = minutes * 60 + seconds;
                updateDisplay();
            }
        });

        secondsInput.addEventListener('input', () => {
            if (!isRunning) {
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                remainingTime = minutes * 60 + seconds;
                updateDisplay();
            }
        });

        // Dog idle animation
        const dogContainer = document.getElementById('dogContainer');

        function randomIdleAnimation() {
            const randomDelay = Math.random() * 20000 + 10000; // 10-30 seconds

            setTimeout(() => {
                dogContainer.classList.add('idle');
                setTimeout(() => {
                    dogContainer.classList.remove('idle');
                    randomIdleAnimation();
                }, 1500);
            }, randomDelay);
        }

        randomIdleAnimation();

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
