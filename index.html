<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Year Progress Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #e3f2fd 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 100%;
            width: 100%;
            padding: 0 10px;
        }

        h1 {
            text-align: center;
            color: #4a5568;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .year-display {
            text-align: center;
            color: #718096;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            margin-bottom: 30px;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .day-cell {
            aspect-ratio: 1;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: white;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .day-cell.passed {
            background: #cbd5e0;
            border-color: #a0aec0;
        }

        .day-cell.today {
            border-color: #667eea;
            border-width: 3px;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        /* Hand-drawn blue flower */
        .flower {
            width: 28px;
            height: 28px;
            position: relative;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .day-cell.passed .flower {
            opacity: 0.3;
        }

        /* Flower petals */
        .petal {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #60a5fa;
            border-radius: 50% 50% 0 50%;
            transform-origin: bottom right;
        }

        .petal:nth-child(1) {
            top: 4px;
            left: 9px;
            transform: rotate(0deg);
        }

        .petal:nth-child(2) {
            top: 7px;
            left: 15px;
            transform: rotate(72deg);
        }

        .petal:nth-child(3) {
            top: 13px;
            left: 14px;
            transform: rotate(144deg);
        }

        .petal:nth-child(4) {
            top: 13px;
            left: 7px;
            transform: rotate(216deg);
        }

        .petal:nth-child(5) {
            top: 7px;
            left: 3px;
            transform: rotate(288deg);
        }

        /* Flower center */
        .flower-center {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fbbf24;
            border-radius: 50%;
            top: 11px;
            left: 11px;
            box-shadow: 0 0 0 1px #f59e0b;
        }

        /* Flower stem (small dot at bottom) */
        .stem {
            position: absolute;
            width: 2px;
            height: 8px;
            background: #34d399;
            bottom: 2px;
            left: 13px;
            border-radius: 1px;
        }

        .stats {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .days-remaining {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }

        .days-label {
            font-size: 18px;
            color: #718096;
            margin-bottom: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 14px;
            color: #a0aec0;
        }

        @media (max-width: 375px) {
            .days-grid {
                grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
                gap: 6px;
                padding: 15px;
            }

            .flower {
                width: 24px;
                height: 24px;
            }

            .petal {
                width: 9px;
                height: 9px;
            }

            h1 {
                font-size: 20px;
            }

            .days-remaining {
                font-size: 40px;
            }
        }

        /* Add a subtle animation to today's cell */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .day-cell.today {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌸 Year Progress Tracker 🌸</h1>
        <div class="year-display" id="yearDisplay"></div>

        <div class="days-grid" id="daysGrid"></div>

        <div class="stats">
            <div class="days-remaining" id="daysRemaining"></div>
            <div class="days-label">days remaining in <span id="currentYear"></span></div>

            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
        </div>
    </div>

    <script>
        function isLeapYear(year) {
            return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
        }

        function getDayOfYear(date) {
            const start = new Date(date.getFullYear(), 0, 0);
            const diff = date - start;
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor(diff / oneDay);
        }

        function initYearProgress() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const totalDays = isLeapYear(currentYear) ? 366 : 365;
            const currentDay = getDayOfYear(now);
            const daysRemaining = totalDays - currentDay;
            const progressPercent = ((currentDay / totalDays) * 100).toFixed(1);

            // Update year display
            document.getElementById('yearDisplay').textContent = currentYear;
            document.getElementById('currentYear').textContent = currentYear;

            // Update days remaining
            document.getElementById('daysRemaining').textContent = daysRemaining;

            // Update progress bar
            document.getElementById('progressBar').style.width = progressPercent + '%';
            document.getElementById('progressText').textContent = `${progressPercent}% of the year completed`;

            // Generate day cells
            const daysGrid = document.getElementById('daysGrid');
            daysGrid.innerHTML = '';

            for (let i = 1; i <= totalDays; i++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';

                if (i < currentDay) {
                    dayCell.classList.add('passed');
                } else if (i === currentDay) {
                    dayCell.classList.add('today');
                }

                // Create flower
                const flower = document.createElement('div');
                flower.className = 'flower';

                // Create 5 petals
                for (let j = 0; j < 5; j++) {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    flower.appendChild(petal);
                }

                // Create flower center
                const center = document.createElement('div');
                center.className = 'flower-center';
                flower.appendChild(center);

                // Create stem
                const stem = document.createElement('div');
                stem.className = 'stem';
                flower.appendChild(stem);

                dayCell.appendChild(flower);
                daysGrid.appendChild(dayCell);
            }
        }

        // Initialize on page load
        initYearProgress();

        // Update at midnight (check every minute)
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0) {
                initYearProgress();
            }
        }, 60000);
    </script>
</body>
</html>
