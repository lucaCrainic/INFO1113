<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Dog Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #FFF5F7;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Pixel Dog Container */
        .dog-container {
            position: absolute;
            top: 57%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
            transition: transform 0.1s;
        }

        .dog-container:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* Pixel Art Dog */
        .pixel-dog {
            width: 180px;
            height: 180px;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            position: relative;
        }

        /* Tail wagging animation */
        @keyframes wag-tail {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(15deg); }
        }

        .dog-container:hover .tail {
            animation: wag-tail 0.3s ease-in-out infinite;
        }

        /* Idle animation - subtle movement */
        @keyframes idle-bounce {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
            50% { transform: translate(-50%, -50%) translateY(-3px); }
        }

        .dog-container.idle {
            animation: idle-bounce 1.5s ease-in-out;
        }

        /* Bark animation */
        @keyframes bark {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            25% { transform: translate(-50%, -50%) scale(1.05); }
            75% { transform: translate(-50%, -50%) scale(0.98); }
        }

        .dog-container.barking {
            animation: bark 0.4s ease-in-out;
        }

        /* Timer Panel */
        .timer-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90vw;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-panel.collapsed {
            transform: translateX(-50%) translateY(calc(100% - 60px));
        }

        .panel-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        /* Pixel gear icon */
        .settings-btn {
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            cursor: pointer;
            position: relative;
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            pointer-events: none;
        }

        .timer-panel:not(.collapsed) .settings-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-btn:hover {
            transform: rotate(90deg);
        }

        .settings-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                /* Center circle */
                linear-gradient(#8B5A3C 0 0) 50% 50%/8px 8px,
                /* Teeth */
                linear-gradient(#8B5A3C 0 0) 50% 0%/6px 8px,
                linear-gradient(#8B5A3C 0 0) 50% 100%/6px 8px,
                linear-gradient(#8B5A3C 0 0) 0% 50%/8px 6px,
                linear-gradient(#8B5A3C 0 0) 100% 50%/8px 6px,
                linear-gradient(#8B5A3C 0 0) 15% 15%/6px 6px,
                linear-gradient(#8B5A3C 0 0) 85% 15%/6px 6px,
                linear-gradient(#8B5A3C 0 0) 15% 85%/6px 6px,
                linear-gradient(#8B5A3C 0 0) 85% 85%/6px 6px;
            background-repeat: no-repeat;
        }

        .toggle-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #FFE4E9;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
        }

        .toggle-arrow:hover {
            background: #FFD1DC;
        }

        .toggle-arrow::after {
            content: '▼';
            font-size: 14px;
            color: #8B5A3C;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timer-panel.collapsed .toggle-arrow::after {
            transform: rotate(180deg);
        }

        .panel-content {
            padding: 0 30px 30px;
        }

        .timer-display {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: #8B5A3C;
            margin-bottom: 24px;
            letter-spacing: 2px;
        }

        .timer-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .time-input {
            width: 80px;
            padding: 12px;
            border: 2px solid #FFE4E9;
            border-radius: 12px;
            font-size: 18px;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: white;
            transition: border-color 0.3s;
        }

        .time-input:focus {
            outline: none;
            border-color: #FFB6C1;
        }

        .input-label {
            font-size: 12px;
            color: #8B5A3C;
            text-align: center;
            margin-top: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }

        .btn-start {
            background: #8B5A3C;
            color: white;
        }

        .btn-start:hover {
            background: #6F4730;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 90, 60, 0.3);
        }

        .btn-stop {
            background: #FFB6C1;
            color: #5C3A29;
        }

        .btn-stop:hover {
            background: #FFA0B0;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loop-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #8B5A3C;
            font-size: 14px;
        }

        /* Custom Toggle Switch */
        .switch {
            position: relative;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #FFE4E9;
            transition: 0.4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #8B5A3C;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        /* Settings Modal */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .settings-modal.active {
            display: flex;
        }

        .settings-content {
            background: white;
            border-radius: 24px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .settings-title {
            font-size: 24px;
            font-weight: bold;
            color: #8B5A3C;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: #FFE4E9;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #FFD1DC;
        }

        .settings-section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #8B5A3C;
            margin-bottom: 12px;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
        }

        .option-card {
            padding: 12px;
            border: 2px solid #FFE4E9;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            background: white;
        }

        .option-card:hover {
            border-color: #FFB6C1;
            transform: translateY(-2px);
        }

        .option-card.selected {
            border-color: #8B5A3C;
            background: #FFF9FA;
        }

        .option-name {
            font-size: 14px;
            color: #8B5A3C;
            margin-top: 8px;
        }

        .dog-preview {
            width: 60px;
            height: 60px;
            margin: 0 auto;
            image-rendering: pixelated;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .timer-panel {
                width: 100vw;
            }

            .timer-display {
                font-size: 36px;
            }

            .pixel-dog {
                width: 140px;
                height: 140px;
            }

            .option-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

                <!-- Collar -->
                <rect x="24" y="30" width="16" height="3" fill="#FFB6C1"/>
                <rect x="31" y="30" width="2" height="3" fill="#FFD700"/>
            </g>
        </svg>
    </div>

    <!-- Timer Panel -->
    <div class="timer-panel collapsed" id="timerPanel">
        <div class="panel-header">
            <button class="settings-btn" id="settingsBtn" onclick="event.stopPropagation()"></button>
            <div class="toggle-arrow" id="panelHeader"></div>
            <div style="width: 28px;"></div> <!-- Spacer -->
        </div>
        <div class="panel-content">
            <div class="timer-display" id="timerDisplay">00:00</div>

            <div class="timer-inputs">
                <div class="input-group">
                    <input type="number" class="time-input" id="minutesInput" min="0" max="99" value="5" placeholder="00">
                    <div class="input-label">minutes</div>
                </div>
                <div class="input-group">
                    <input type="number" class="time-input" id="secondsInput" min="0" max="59" value="0" placeholder="00">
                    <div class="input-label">seconds</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-start" id="startBtn">Start</button>
                <button class="btn btn-stop" id="stopBtn" disabled>Stop</button>
            </div>

            <div class="loop-toggle">
                <span>Loop Timer</span>
                <label class="switch">
                    <input type="checkbox" id="loopToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <div class="settings-header">
                <div class="settings-title">Settings</div>
                <button class="close-btn" id="closeSettings">×</button>
            </div>

            <div class="settings-section">
                <div class="section-title">Choose Your Dog</div>
                <div class="option-grid" id="dogSelector">
                    <!-- Dog options will be inserted here -->
                </div>
            </div>

            <div class="settings-section">
                <div class="section-title">Timer Sound</div>
                <div class="option-grid" id="soundSelector">
                    <!-- Sound options will be inserted here -->
                </div>
            </div>
        </div>
    </div>

        // State

        let currentSound = 'bell';
        let audioContext = null;

        // Initialize audio
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play bark sound - IMPROVED TO SOUND LIKE ACTUAL BARK
        function playBark() {
            initAudio();

            const dogContainer = document.getElementById('dogContainer');
            dogContainer.classList.add('barking');
            setTimeout(() => dogContainer.classList.remove('barking'), 400);

            // First bark - sharp attack
            const osc1 = audioContext.createOscillator();
            const gain1 = audioContext.createGain();
            const filter1 = audioContext.createBiquadFilter();

            osc1.connect(filter1);
            filter1.connect(gain1);
            gain1.connect(audioContext.destination);

            // Bark characteristics: quick burst of noise with formants
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(150, audioContext.currentTime);
            osc1.frequency.exponentialRampToValueAtTime(80, audioContext.currentTime + 0.08);

            filter1.type = 'bandpass';
            filter1.frequency.value = 600;
            filter1.Q.value = 5;

            gain1.gain.setValueAtTime(0.4, audioContext.currentTime);
            gain1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.08);

            osc1.start(audioContext.currentTime);
            osc1.stop(audioContext.currentTime + 0.08);

            // Second bark - slightly different pitch
            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                const gain2 = audioContext.createGain();
                const filter2 = audioContext.createBiquadFilter();

                osc2.connect(filter2);
                filter2.connect(gain2);
                gain2.connect(audioContext.destination);

                osc2.type = 'sawtooth';
                osc2.frequency.setValueAtTime(170, audioContext.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(90, audioContext.currentTime + 0.08);

                filter2.type = 'bandpass';
                filter2.frequency.value = 650;
                filter2.Q.value = 5;

                gain2.gain.setValueAtTime(0.4, audioContext.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.08);

                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.08);
            }, 150);
        }

        // Play timer sound
        function playTimerSound() {
            initAudio();
            sounds[currentSound].play(audioContext);
        }

        // Switch dog
        function switchDog(dogId) {
            currentDog = dogId;
            const dogSprite = document.getElementById('dogSprite');
            dogSprite.innerHTML = dogs[dogId].svg;

            // Update selected state
            document.querySelectorAll('#dogSelector .option-card').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelector(`[data-dog="${dogId}"]`).classList.add('selected');

            // Save to localStorage
            localStorage.setItem('selectedDog', dogId);
        }

        // Switch sound
        function switchSound(soundId) {
            currentSound = soundId;

            // Update selected state
            document.querySelectorAll('#soundSelector .option-card').forEach(card => {
                card.classList.remove('selected');
            });
            document.querySelector(`[data-sound="${soundId}"]`).classList.add('selected');

            // Save to localStorage
            localStorage.setItem('selectedSound', soundId);
        }

        // Initialize settings
        function initSettings() {
            // Populate dog selector
            const dogSelector = document.getElementById('dogSelector');
            Object.keys(dogs).forEach(dogId => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.dataset.dog = dogId;
                if (dogId === currentDog) card.classList.add('selected');

                const preview = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                preview.setAttribute('class', 'dog-preview');
                preview.setAttribute('viewBox', '0 0 64 64');
                preview.innerHTML = dogs[dogId].svg;

                const name = document.createElement('div');
                name.className = 'option-name';
                name.textContent = dogs[dogId].name;

                card.appendChild(preview);
                card.appendChild(name);
                card.addEventListener('click', () => switchDog(dogId));

                dogSelector.appendChild(card);
            });

            // Populate sound selector
            const soundSelector = document.getElementById('soundSelector');
            Object.keys(sounds).forEach(soundId => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.dataset.sound = soundId;
                if (soundId === currentSound) card.classList.add('selected');

                const icon = document.createElement('div');
                icon.style.fontSize = '32px';
                icon.textContent = sounds[soundId].icon;

                const name = document.createElement('div');
                name.className = 'option-name';
                name.textContent = sounds[soundId].name;

                card.appendChild(icon);
                card.appendChild(name);
                card.addEventListener('click', () => {
                    switchSound(soundId);
                    // Play preview
                    initAudio();
                    sounds[soundId].play(audioContext);
                });

                soundSelector.appendChild(card);
            });

            // Load saved preferences
            const savedDog = localStorage.getItem('selectedDog');
            const savedSound = localStorage.getItem('selectedSound');

            if (savedDog && dogs[savedDog]) {
                switchDog(savedDog);
            }

            if (savedSound && sounds[savedSound]) {
                currentSound = savedSound;
                document.querySelector(`[data-sound="${savedSound}"]`).classList.add('selected');
            }
        }

        // Settings modal
        const settingsModal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettings = document.getElementById('closeSettings');

        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('active');
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });

        // Dog click handler
        document.getElementById('dogContainer').addEventListener('click', playBark);

        // Timer Panel Toggle
        const timerPanel = document.getElementById('timerPanel');
        const panelHeader = document.getElementById('panelHeader');

        panelHeader.addEventListener('click', () => {
            timerPanel.classList.toggle('collapsed');
        });

        // Timer Logic
        let timerInterval = null;
        let remainingTime = 0;
        let isRunning = false;

        const timerDisplay = document.getElementById('timerDisplay');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const loopToggle = document.getElementById('loopToggle');

        function updateDisplay() {
            const minutes = Math.floor(remainingTime / 60);
            const seconds = remainingTime % 60;
            timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            initAudio();

            if (!isRunning) {
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                remainingTime = minutes * 60 + seconds;

                if (remainingTime === 0) return;

                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                minutesInput.disabled = true;
                secondsInput.disabled = true;

                timerInterval = setInterval(() => {
                    if (remainingTime > 0) {
                        remainingTime--;
                        updateDisplay();
                    } else {
                        playTimerSound();

                        if (loopToggle.checked) {
                            const minutes = parseInt(minutesInput.value) || 0;
                            const seconds = parseInt(secondsInput.value) || 0;
                            remainingTime = minutes * 60 + seconds;
                        } else {
                            stopTimer();
                        }
                    }
                }, 1000);

                updateDisplay();
            }
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            stopBtn.disabled = true;
            minutesInput.disabled = false;
            secondsInput.disabled = false;

            const minutes = parseInt(minutesInput.value) || 0;
            const seconds = parseInt(secondsInput.value) || 0;
            remainingTime = minutes * 60 + seconds;
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        stopBtn.addEventListener('click', stopTimer);

        minutesInput.addEventListener('input', () => {
            if (!isRunning) {
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                remainingTime = minutes * 60 + seconds;
                updateDisplay();
            }
        });

        secondsInput.addEventListener('input', () => {
            if (!isRunning) {
                const minutes = parseInt(minutesInput.value) || 0;
                const seconds = parseInt(secondsInput.value) || 0;
                remainingTime = minutes * 60 + seconds;
                updateDisplay();
            }
        });

        // Dog idle animation
        const dogContainer = document.getElementById('dogContainer');

        function randomIdleAnimation() {
            const randomDelay = Math.random() * 20000 + 10000; // 10-30 seconds

            setTimeout(() => {
                dogContainer.classList.add('idle');
                setTimeout(() => {
                    dogContainer.classList.remove('idle');
                    randomIdleAnimation();
                }, 1500);
            }, randomDelay);
        }

        randomIdleAnimation();

        // Initialize
        initSettings();
        updateDisplay();
    </script>
</body>
</html>
